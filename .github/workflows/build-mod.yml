name: Build Minecraft Mod

on:
  push:
    branches: [ "main" ] # Change to your default branch name if different
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' # Use '17' if you are developing for Minecraft 1.18 to 1.20.4
        distribution: 'temurin'
        cache: 'gradle'

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Build Mod JAR
      run: ./gradlew build

    - name: Upload Mod JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: minecraft-mod-jar
        path: build/libs/!(*-sources|*-dev).jar # Grabs the release JAR, ignores sources/dev variants
