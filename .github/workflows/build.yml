name: Build

on:
  push:
    branches: [main]
  pull_request:
    # A change that only touches documentation has nothing to build or test
    paths-ignore:
      - '**.md'

# A newer push to the same pull request replaces the run in progress. Runs on main are never cancelled, because they publish releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # On a pull request: compiles the mod, runs the unit tests and the in-game tests (src/gametest) on a headless server
      - name: Build and test
        if: github.event_name == 'pull_request'
        run: ./gradlew build --no-daemon
      # After a merge to main the change has already passed all of that on its pull request, so this only builds the jar
      # (the release job publishes it): the tests are not run a second time
      - name: Build the jar
        if: github.event_name == 'push'
        run: ./gradlew build -x test -x runGameTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nexium
          path: build/libs/*.jar

  client-test:
    # Pull requests only: after a merge to main the same tests have just passed on the pull request, so they are not run again.
    if: github.event_name == 'pull_request'
    # Opens a real game client on a virtual display (Xvfb) and runs the client tests in src/gametest: the terminal
    # grid, the trinket and wings slots, the magnet on the Key Binds screen, and barrels keeping their items through
    # save and quit. Their screenshots are kept as an artifact.
    # There is no GPU: Minecraft can't get an OpenGL window from Xvfb ("Couldn't find matching GLX visual"), so it
    # falls back to Vulkan, which Mesa's software driver (lavapipe, in mesa-vulkan-drivers) provides.
    # The client tests are split over five jobs that run side by side: job i runs every fifth test starting at i
    # (see ShardedClientTests), so together they run each test once in about a fifth of the time.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      NEXIUM_SHARD: ${{ matrix.shard }}/5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual display and software Vulkan
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1
      - name: Run the client tests
        # If the client can't create a window it waits forever, so stop well before the job's limit
        timeout-minutes: 15
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --no-daemon
      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-screenshots-${{ matrix.shard }}
          path: |
            build/run/clientGameTest/screenshots
            build/run/clientGameTest/logs
          if-no-files-found: ignore

  release:
    # Publishes a GitHub Release (tag, jar and notes) when main gets a mod_version that has no release yet, so a release
    # needs no tag and no manual run: raise mod_version in gradle.properties, add the "## <version>" section to
    # CHANGELOG.md and merge. The release appears once the build has finished (the tests ran on the pull request). A merge that
    # keeps the same mod_version publishes nothing, and this job never runs on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Does this version already have a release?
        id: version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION already has a release, nothing to publish"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      # The jar the build job made and tested
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          name: nexium
          path: jar
      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The notes are the "## <version>" section of CHANGELOG.md
          awk -v v="$VERSION" '/^## / { if (on) exit; on=($2==v); next } on { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md for what changed." > notes.md
          # This creates the tag too, on the commit that was built
          gh release create "v$VERSION" "jar/nexium-$VERSION.jar" \
            --title "Nexium $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
