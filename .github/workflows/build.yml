name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Compiles the mod, runs the unit tests and the in-game tests (src/gametest) on a headless server
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: storage-nexus
          path: build/libs/*.jar
