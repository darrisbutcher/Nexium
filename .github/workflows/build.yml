name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Compiles the mod, runs the unit tests and the in-game tests (src/gametest) on a headless server
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: storage-nexus
          path: build/libs/*.jar

  client-test:
    # Opens a real game client on a virtual display (Xvfb, with Mesa's software OpenGL) and runs the client tests in
    # src/gametest: the terminal grid, the trinket and wings slots, the magnet on the Key Binds screen, and barrels
    # keeping their items through save and quit. Their screenshots are kept as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Run the client tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --no-daemon
      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-screenshots
          path: |
            build/run/clientGameTest/screenshots
            build/run/clientGameTest/logs
          if-no-files-found: ignore
