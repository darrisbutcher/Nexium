plugins {
    // Minecraft 26.1+ ships unobfuscated, so this is the non-remapping Loom plugin
    // and there is no "mappings" line.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Recipe viewers: only their APIs are compiled against; neither is needed to run the mod.
    exclusiveContent {
        forRepository { maven { url = "https://maven.blamejared.com/" } }
        filter { includeGroup "mezz.jei"; includeGroup "net.mezzdev.config" }
    }
    // Jade: its API is compiled against for the optional energy tooltip; it is not needed to run the mod.
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.shedaniel.me/" } }
        filter { includeGroup "me.shedaniel"; includeGroup "me.shedaniel.cloth"; includeGroup "dev.architectury" }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/storagenexus.accesswidener")
}

// In-game tests live in src/gametest (their own small mod, never in the release jar).
// `./gradlew runGameTest` runs them on a headless server; `check` and `build` run them too.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "storagenexus-gametest"
        enableGameTests = true
        enableClientGameTests = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional recipe-viewer support (JEI and REI "+" buttons). compileOnly: not shipped, not required.
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") { transitive = false }
    // `./gradlew runClientGameTest -PwithJei` runs the client test with JEI installed.
    gametestCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    if (project.hasProperty("withJei")) localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

    compileOnly "maven.modrinth:jade:${project.jade_version}"
    // `./gradlew runClientGameTest -PwithJade` runs the client test with Jade installed.
    if (project.hasProperty("withJade")) localRuntime "maven.modrinth:jade:${project.jade_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    // Gradle 9 no longer bundles the launcher
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
    // Report every error, not just the first 100
    it.options.compilerArgs += ['-Xmaxerrs', '10000']
}

java {
    withSourcesJar()
    // Compile with JDK 25 even when Gradle itself runs on an older Java
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
